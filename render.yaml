services:
  - type: web
    name: Report-OIML
    env: python
    region: oregon
    plan: free
    branch: feat/backend-setup
    rootDir: backend
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm ci && npm run build:backend
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_ANY_LOGIN
        value: "true"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
